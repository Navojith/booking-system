# In-cluster Postgres for demos. For production prefer a managed database and
# point DATABASE_URL in the kenora-api secret at it (then drop this file).
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: kenora
type: Opaque
stringData:
  POSTGRES_USER: kenora
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: kenora
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kenora
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kenora
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: postgres } }]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER"'] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
