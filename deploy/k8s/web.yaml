apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kenora
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: kenora-web:latest # replace with your registry/tag
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: API_UPSTREAM, value: 'http://api:3000' }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kenora
spec:
  selector: { app: web }
  ports:
    - { name: http, port: 80, targetPort: http }
