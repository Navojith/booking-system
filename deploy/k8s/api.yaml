apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kenora
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: kenora-api:latest # replace with your registry/tag
          ports: [{ containerPort: 3000, name: http }]
          envFrom:
            - configMapRef: { name: kenora-api }
            - secretRef: { name: kenora-api }
          startupProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kenora
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: kenora
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }
